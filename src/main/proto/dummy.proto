syntax = "proto3";

package dummy;

option java_package = "grpc";
option java_multiple_files = true;

import "proto/errors.proto";

message DummyRequest{
	string name = 2;
	int32 number1 = 1;
	int32 number2 = 3;
}

message DummyResponse{
	string result = 1;
}

service DummyService{
	rpc unaryType(DummyRequest) returns (DummyResponse);
	rpc serverStreaming(DummyRequest) returns (stream DummyResponse);
	rpc clientStreaming(stream DummyRequest) returns (DummyResponse);
	rpc biDirectionalStreaming(stream DummyRequest) returns (stream DummyResponse);
	rpc gettingErrors(ErrorRequest) returns (ErrorResponse);
}