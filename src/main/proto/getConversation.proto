syntax = "proto3";

package dummy;

option java_package = "grpc.conversation";
option java_multiple_files = true;

message GetConversationRequest{
	string name = 1;
}

message GetConversationResponse{
	string uuid = 1;
	string destinatary = 2;
	string sender = 3;
	string textMessage = 4;
	//Sent or Received
	string type = 5;
}